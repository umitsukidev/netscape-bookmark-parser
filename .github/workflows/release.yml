name: Release to NPM and JSR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for a new version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists"
            exit 0
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            changed=true
          else
            previous_version="$(git show HEAD^:package.json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk).on("end", () => process.stdout.write(JSON.parse(data).version));')"
            changed=$([ "$version" != "$previous_version" ] && echo true || echo false)
          fi
          echo "should_release=${changed}" >> "$GITHUB_OUTPUT"
          if [ "$changed" = true ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pnpm and Node.js
        if: steps.version.outputs.should_release == 'true'
        uses: pnpm/setup@v3
        with:
          version: 12.4.2
          require-lockfile: true
          cache: true
      - name: Configure NPM authentication
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Test
        if: steps.version.outputs.should_release == 'true'
        run: pnpm test
      - name: Typecheck
        if: steps.version.outputs.should_release == 'true'
        run: pnpm typecheck
      - name: Build
        if: steps.version.outputs.should_release == 'true'
        run: pnpm build
      - name: Publish to NPM
        if: steps.version.outputs.should_release == 'true'
        run: |
          if npm view "netscape-bookmark-parser@${{ steps.version.outputs.version }}" version --silent >/dev/null 2>&1; then
            echo "NPM version ${{ steps.version.outputs.version }} is already published"
          else
            pnpm publish --no-git-checks --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to JSR
        if: steps.version.outputs.should_release == 'true'
        run: |
          if pnpm dlx jsr info "@grakeice/netscape-bookmark-parser@${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "JSR version ${{ steps.version.outputs.version }} is already published"
          else
            pnpm dlx jsr publish --provenance
          fi
      - name: Create Git tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes
