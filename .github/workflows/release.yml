name: Release to NPM and JSR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Check for a new version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          sha="$(git rev-parse HEAD)"
          tag_exists=false
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_exists=true
          fi

          should_release=false
          if [ "$tag_exists" = false ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              should_release=true
            elif git rev-parse HEAD^ >/dev/null 2>&1 && git cat-file -e HEAD^:package.json 2>/dev/null; then
              previous_version="$(git show HEAD^:package.json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk).on("end", () => process.stdout.write(JSON.parse(data).version));')"
              if [ "$version" != "$previous_version" ]; then
                should_release=true
              fi
            fi
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          if [ "$should_release" = true ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          require-lockfile: true
      - name: Configure NPM authentication
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Test
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Publish to NPM
        run: |
          if pnpm view "netscape-bookmark-parser@${{ needs.detect.outputs.version }}" version --silent >/dev/null 2>&1; then
            echo "NPM version ${{ needs.detect.outputs.version }} is already published"
          else
            pnpm publish --no-git-checks --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to JSR
        run: pnpm dlx jsr publish --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ needs.detect.outputs.tag }}"
          --target "${{ needs.detect.outputs.sha }}"
          --title "${{ needs.detect.outputs.tag }}"
          --generate-notes
